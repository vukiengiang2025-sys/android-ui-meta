name: Update Android UI Meta Repo

on:
  schedule:
    - cron: '0 2 * * *' # Chạy hàng ngày lúc 2:00 UTC (9:00 sáng VN)
  workflow_dispatch:      # Cho phép chạy thủ công

jobs:
  update-meta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch data and generate README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_and_generate.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "🤖 Tự động cập nhật danh sách UI/UX" && git push)
